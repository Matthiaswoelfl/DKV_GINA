<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOÄneu – Steigerungsmatrix</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --line:#d5dbe3; --line-soft:#e8ecf1;
  --ink:#131c27; --ink-soft:#4a5868; --accent:#0b4f8a; --accent-bg:#e4eef8;
  --ok:#235c2c; --ok-bg:#e2efda; --theo:#a81414; --theo-bg:#f0f0f0;
  --G:#a3231b; --G-bg:#fbe6e3; --B:#7a4f00; --B-bg:#fbefd2; --S:#5c3399; --S-bg:#ede4f8;
  --F:#00625a; --F-bg:#dcf1ee; --V:#0f4f9e; --V-bg:#e0ecfb;
  --rowh:38px; --headh:36px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);
  display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

header{background:#0b3157;color:#fff;padding:8px 16px;display:flex;align-items:baseline;gap:18px}
header h1{font-size:17px;margin:0;font-weight:650}
header{align-items:center;padding-bottom:0;padding-top:0}
#tabs{display:flex;gap:2px;align-self:flex-end;margin-top:6px}
#tabs button{border:0;background:rgba(255,255,255,.1);color:#dbe7f3;padding:8px 16px;border-radius:7px 7px 0 0;font-weight:600;font-size:14px}
#tabs button:hover{background:rgba(255,255,255,.2)}
#tabs button[aria-selected=true]{background:#fff7dd;color:#0b3157}
#tabs button:focus-visible{outline-color:#fff}
.fset{display:contents}
[hidden]{display:none!important}
main.alt #hf,main.alt #hm,main:not(.alt) #hp{display:none}
#hp{grid-column:span 2;text-align:left}
.cNN{--c:#a3231b;--cb:#fbe6e3}.cNU{--c:#0f4f9e;--cb:#e0ecfb}
.badge .sh{display:none}
.compact .badge .lg{display:none}.compact .badge .sh{display:inline}
main.alt.compact .badge i{display:inline}
main.alt .grid{grid-template-columns:64px minmax(0,1.3fr) 92px 200px minmax(0,1fr) 0}
main.alt.compact .grid{grid-template-columns:50px minmax(0,1.1fr) 76px 98px minmax(0,1fr) 0}
.cMS{--c:#1d6b2e;--cb:#dff3e3}.cMP{--c:#0f4f9e;--cb:#e0ecfb}.cMU{--c:#8a5300;--cb:#fbefd2}.cMK{--c:#a3231b;--cb:#fbe6e3}.cMX{--c:#5c3399;--cb:#ede4f8}
.chip .pr{font-weight:650;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid #8c98a8;border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;font-size:13px}
.seg button + button{border-left:1px solid #8c98a8}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:650}
.mpbox{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:10px 12px;margin-top:12px}
.mpbox .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mpbox .pz{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.mpbox .bar{height:6px;background:var(--line-soft);border-radius:3px;margin:8px 0;overflow:hidden}
.mpbox .bar i{display:block;height:100%;background:var(--c)}
.mpbox p{margin:6px 0 0;font-size:13px}
.mpbox .meta{font-size:12.5px;color:var(--ink-soft)}
.regel .zl{border-top:0;font-size:14px;padding:0 0 3px}
.regel .zl b{min-width:0;margin-right:6px}
mark{background:#ffe9a8;color:inherit;padding:0 2px;border-radius:2px}
.cIB{--c:#3d4a5c;--cb:#e9edf2}.cIN{--c:#0b6b3a;--cb:#dff3e6}
#ivinfo{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--ink-soft)}
#ivinfo b{color:var(--ink);font-size:14px;display:block;margin-bottom:2px}
#ivinfo .badge{margin-right:6px}
#ivsel{max-width:360px}
.regel h4{margin:0 0 2px;font-size:14px}
.regel .lang{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
.regel blockquote + .anz{margin-top:-2px;margin-bottom:8px}
.row .pv{grid-column:span 2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.regel{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.regel .rk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.regel .bed{font-size:12px;color:#8a5300;font-weight:650}
.regel blockquote{margin:0 0 6px;font-size:13.5px}
.regel .anz{font-size:12px;color:var(--ink-soft);margin:6px 0 3px}
.zl{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line-soft);background:none;padding:3px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.zl:hover{background:var(--accent-bg)}
.zl b{display:inline-block;min-width:46px;font-variant-numeric:tabular-nums}
.zl span{color:var(--ink)}
details.mehr summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:3px 2px}
.gen{border-top:1px solid var(--line-soft);padding:6px 0}
.gen q{display:block;font-size:12.5px;color:var(--ink-soft);quotes:none;margin-top:2px}
ul.rest{margin:0;padding-left:18px;font-size:13px}
ul.rest li{margin-bottom:4px}
header span{color:#c4d6ea;font-size:12.5px}
#hinweis{background:#fff7dd;border-bottom:1px solid #e5d08a;padding:6px 16px;font-size:12.5px;display:flex;gap:6px 18px;flex-wrap:wrap}
#hinweis b{font-weight:650}

#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
#app.drawer-open{grid-template-columns:250px minmax(0,1fr) 440px}
@media (max-width:1400px){#app.drawer-open{grid-template-columns:200px minmax(0,1fr) 400px}}

nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px 0}
nav button{display:flex;width:100%;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:5px 12px;border-left:3px solid transparent}
nav button:hover{background:var(--bg)}
nav button[aria-current=true]{background:var(--accent-bg);border-left-color:var(--accent);font-weight:650}
nav button .n{margin-left:auto;color:var(--ink-soft);font-size:12px;font-variant-numeric:tabular-nums;font-weight:400}
nav .kap{font-weight:650}
nav .kb{flex:none;width:16px}
nav .kt{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
nav .abs{padding-left:26px;font-size:13px}

main{display:grid;grid-template-rows:auto auto auto 1fr;min-width:0;min-height:0}
#toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#q{flex:1 1 100%;min-width:180px;padding:7px 10px;border:1px solid #8c98a8;border-radius:6px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:3px 10px 3px 4px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.chip[aria-pressed=true] .ltr{background:#fff;color:var(--c)}
.chip .cnt{font-variant-numeric:tabular-nums;opacity:.85;font-size:12px}
.ltr{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:12px;flex:none}
.cG{--c:var(--G);--cb:var(--G-bg)}.cB{--c:var(--B);--cb:var(--B-bg)}.cS{--c:var(--S);--cb:var(--S-bg)}.cF{--c:var(--F);--cb:var(--F-bg)}.cV{--c:var(--V);--cb:var(--V-bg)}.cN{--c:#55606e;--cb:#eceff3}
.compact .chip.cN .nm{display:inline}
.row.ohne .mx{font-weight:400;color:var(--ink-soft)}
#toolbar label{display:inline-flex;align-items:center;gap:6px;font-size:13px}
#toolbar select{padding:5px 6px;border:1px solid #8c98a8;border-radius:6px;background:#fff}
.btn{border:1px solid #8c98a8;background:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
.btn:hover{background:var(--bg)}
#status{margin-left:auto;font-size:13px;color:var(--ink-soft);white-space:nowrap}

.grid{display:grid;grid-template-columns:64px minmax(0,1fr) 92px 216px 84px 118px;gap:0 10px;align-items:center;padding:0 14px}
.compact .grid{grid-template-columns:50px minmax(0,1fr) 76px 98px 50px 92px;gap:0 8px}
.compact .chip .nm{display:none}
.compact .badges{gap:2px}
.compact .row small{font-size:10.5px}
#colhead{background:#eef1f5;border-bottom:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink-soft);height:30px}
#colhead button{border:0;background:none;font-weight:650;padding:0;color:inherit;text-align:inherit;white-space:nowrap}
#colhead button.num{justify-self:end}
#colhead button[aria-sort]{color:var(--ink)}
#list{overflow:auto;position:relative;background:var(--panel);outline-offset:-2px}
#spacer{position:relative}
.row,.ghead{position:absolute;left:0;right:0}
.row{height:var(--rowh);border-bottom:1px solid var(--line-soft);cursor:pointer}
.row:hover{background:#f5f8fb}
.row.active{box-shadow:inset 3px 0 0 var(--accent);background:#f0f5fa}
.row.sel{background:var(--accent-bg)}
.row .z{font-weight:650;font-variant-numeric:tabular-nums}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mx{font-weight:650}
.row small{display:block;font-size:11px;color:var(--theo);font-weight:400;line-height:1.1}
.badges{display:flex;gap:4px;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:3px;background:var(--cb);color:var(--c);border:1px solid var(--c);border-radius:4px;padding:0 5px 0 4px;font-size:12px;font-weight:650;white-space:nowrap;line-height:18px}
.compact .badge i{display:none}
.badge i{font-style:normal;font-weight:400;font-variant-numeric:tabular-nums}
.ghead{height:var(--headh);background:#e9edf2;border-bottom:1px solid var(--line);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;border-left:0;border-right:0;width:100%;text-align:left;font-weight:650;font-size:13px}
.ghead .n{color:var(--ink-soft);font-weight:400}
.ghead .car{display:inline-block;width:12px;transition:transform .1s}
.ghead[aria-expanded=false] .car{transform:rotate(-90deg)}
#empty{padding:40px;text-align:center;color:var(--ink-soft)}

aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px;display:none}
.drawer-open aside{display:block}
aside h2{font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
aside h2 .close{margin-left:auto}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:18px 0 6px}
aside .crumb{font-size:12.5px;color:var(--ink-soft);margin:2px 0 8px}
aside .leistung{margin:0 0 6px;font-size:14.5px}
aside .zusatz{margin:0 0 6px;font-size:12.5px;color:var(--ink-soft);white-space:pre-line}
aside .zusatz b{font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kpi span{display:block;font-size:11.5px;color:var(--ink-soft)}
.kpi b{font-size:16px;font-variant-numeric:tabular-nums}
.kpi.t{border-color:#d9a3a3}.kpi.t b{color:var(--theo)}
.kpis.two{grid-template-columns:repeat(2,1fr)}
.szen{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.szen label{display:flex;align-items:center;gap:8px;padding:3px 0}
.szen .res{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:650;display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.szen .res.theo{background:#fde8e8;color:var(--theo);outline:2px dashed var(--theo)}
.szen .res.none{background:var(--bg);color:var(--ink-soft)}
.szen .warn{color:var(--theo);font-size:12.5px;margin-top:6px;font-weight:650}
.szen .note{font-size:12px;color:var(--ink-soft);margin-top:6px}
table.mo{width:100%;border-collapse:collapse;font-size:13px}
table.mo th{font-size:11.5px;text-align:left;color:var(--ink-soft);font-weight:650;border-bottom:1px solid var(--line);padding:4px 6px}
table.mo td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.mo tr.p td{background:var(--ok-bg);color:var(--ok)}
table.mo tr.t td{background:var(--theo-bg);color:var(--theo)}
table.mo tr.t td.f,table.mo tr.t td.e{text-decoration:line-through}
table.mo .th{color:var(--theo);font-size:12px;display:block}
table.mo .th s{text-decoration:line-through}
.grund{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;margin-bottom:8px}
.grund summary{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:650}
.grund summary .fx{margin-left:auto;font-variant-numeric:tabular-nums}
.grund dl{margin:0;padding:2px 10px 10px;font-size:13px}
.grund dt{font-size:11.5px;color:var(--ink-soft);font-weight:650;margin-top:7px}
.grund dd{margin:1px 0 0}
.abid{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 4px 3px 0;font-variant-numeric:tabular-nums;background:var(--bg)}
.wort{border-left:3px solid var(--line);padding-left:8px;margin:4px 0;color:var(--ink-soft)}
.missing{color:#8a5300;font-size:12.5px}
.nosteig{margin-top:12px;border:1px solid #b9c1cc;border-left:4px solid #55606e;border-radius:6px;padding:10px 12px;background:#f3f5f8;font-size:13px}
.nosteig b{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:14px}
.link{font-size:12.5px;margin-top:14px;color:var(--ink-soft)}
#tip{position:fixed;z-index:50;max-width:460px;background:#fff;border:1px solid var(--c);border-top:4px solid var(--c);border-radius:6px;padding:9px 12px;box-shadow:0 8px 24px rgba(10,25,45,.22);font-size:12.5px;line-height:1.45;pointer-events:none}
#tip b{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:5px}
#tip p{margin:0 0 6px}
#tip small{color:var(--ink-soft)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px ui-monospace,monospace;background:#fff}
</style>
</head>
<body>
<header><h1>GOÄneu</h1>
  <div id="tabs" role="tablist" aria-label="Ansicht">
    <button role="tab" data-v="ab" aria-selected="true">AB-Steigerungsgründe</button>
    <button role="tab" data-v="nb" aria-selected="false">Nebeneinanderberechnung</button>
    <button role="tab" data-v="iv" aria-selected="false">Intervalle</button>
    <button role="tab" data-v="mp" aria-selected="false">Ziffern-Mapping alt ↔ neu</button>
  </div><span id="sub"></span></header>
<div id="hinweis" role="note"></div>
<div id="app">
  <nav aria-label="Kapitel und Abschnitte" id="nav"></nav>
  <main>
    <div id="toolbar">
      <input id="q" type="search" placeholder="Ziffer oder Leistung suchen …  ( / )" aria-label="Suche nach Ziffer oder Leistungsbezeichnung" autocomplete="off">
      <span class="fset" id="f-ab">
      <div class="chips" id="chips" role="group" aria-label="Steigerungsgründe (alle gewählten müssen zutreffen)"></div>
      <label>Anzahl AB-Gründe <select id="anz" aria-label="Filter nach Anzahl möglicher AB-Steigerungsgründe"></select></label>
      <label>Max. Faktor <select id="fmax" aria-label="Filter maximaler Faktor"></select></label>
      <label><input type="checkbox" id="theo"> Theoretische Kombinationen einbeziehen</label>
      </span>
      <span class="fset" id="f-nb" hidden>
      <div class="chips" id="chipsnb" role="group" aria-label="Art der Nebeneinander-Regel"></div>
      <label>Genannte Ziffern <select id="nbanz" aria-label="Filter nach Anzahl der in den Regeln genannten Ziffern"></select></label>
      <label>Regelart <select id="nbart" aria-label="Filter nach Art der Regel"></select></label>
      <label title="Zählt eine Ziffer auch dann, wenn sie nur in der Regel einer anderen Ziffer genannt wird (Gegenrichtung: Ableitung, kein Gesetzeswortlaut)"><input type="checkbox" id="nbrev"> Nennungen bei anderen Ziffern einbeziehen</label>
      <button class="btn" id="abbtn">Allgemeine Bestimmungen</button>
      </span>
      <span class="fset" id="f-iv" hidden>
      <div class="chips" id="chipsiv" role="group" aria-label="Status des Intervalls"></div>
      <label>Intervall <select id="ivsel" aria-label="Intervall auswählen"></select></label>
      <label>Quelle <select id="ivq" aria-label="Fundstelle des Wortlauts">
        <option value="">alle</option><option value="A">Abrechnungsbestimmung</option><option value="LZ">Legende oder Zusatz</option></select></label>
      </span>
      <span class="fset" id="f-mp" hidden>
      <div class="seg" id="mpdir" role="group" aria-label="Richtung">
        <button data-d="alt" aria-pressed="true">Alte GOÄ → neue Ziffer</button><button data-d="neu" aria-pressed="false">Neue GOÄ → alte Ziffer</button></div>
      <div class="chips" id="chipsmp" role="group" aria-label="Status der Zuordnung"></div>
      <label>Verhältnis <select id="mpvh" aria-label="Filter nach Verhältnis"></select></label>
      <label>Quelle <select id="mpql" aria-label="Filter nach Quelle der Zuordnung"></select></label>
      </span>
      <button class="btn" id="reset">Filter zurücksetzen</button>
      <button class="btn" id="csv">CSV exportieren</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <div id="ivinfo" hidden></div>
    <div id="colhead" class="grid">
      <button data-s="z">Ziffer</button><button data-s="t">Leistung</button><button data-s="g" class="num">Gebühr</button>
      <span id="hg">Steigerungsgründe</span><button data-s="f" class="num" id="hf">Max. Faktor</button><button data-s="m" class="num" id="hm">Max. Gebührensatz</button><button data-s="p" id="hp">Genannte Ziffern</button>
    </div>
    <div id="list" tabindex="0" role="listbox" aria-label="Ergebnisliste. Pfeiltasten wählen, Eingabetaste öffnet Details."><div id="spacer"></div></div>
  </main>
  <aside id="drawer" aria-label="Details zur Ziffer" tabindex="-1"></aside>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const euro = c => { const s = String(c).padStart(3,'0'); return s.slice(0,-2).replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ',' + s.slice(-2) + ' €'; };
const fnum = f => parseFloat(f.replace(',','.'));   // nur zum Sortieren/Filtern, nie zum Rechnen
const GR = Object.fromEntries(D.gruende.map(g => [g.k, g]));
const KEYS = D.gruende.map(g => g.k);
const R = D.rows.map((r, idx) => { const m = r[6] < 0 ? null : D.muster[r[6]]; return {i:idx, zn:r[0], alt:[], pz:new Set(), vhs:new Set(), qls:new Set(), mst:'NEU', p:null, z:r[0], a:r[1], t:r[2], g:r[3], bauch:r[4], ct:r[5], m, c:r[7], zus:r[8], seite:r[9], n: m ? Object.keys(m.gruende).length : 0, lt:r[2].toLowerCase(), zs:String(r[0]), rg:r[10]||[], we:r[11]||[], iv:r[12]||[], pN:[], pU:[], qN:[], qU:[], gen:[], oN:false, oU:false, fl:false, hE:false, hB:false, hAB:false}; });
const BYZ = new Map(R.map(r => [r.z, r]));
const ROWH = 38, HEADH = 36;
/* ---------- Mapping alte GOÄ ↔ GOÄneu ---------- */
const MST = {SICHER:{name:'Sicher', ltr:'S', cls:'cMS', pr:'≥ 80 %'}, PLAUSIBEL:{name:'Plausibel', ltr:'P', cls:'cMP', pr:'50–79 %'}, UNSICHER:{name:'Unsicher', ltr:'U', cls:'cMU', pr:'25–49 %'},
  KEINE_ENTSPRECHUNG_ERKENNBAR:{name:'Keine Entsprechung', ltr:'K', cls:'cMK', pr:'< 25 %'}, SAMMELPOSITION:{name:'Sammelposition', ltr:'X', cls:'cMX'}, NEU:{name:'Ohne alte Ziffer', ltr:'–', cls:'cN'}};
const pct = p => p === null || p === undefined ? '' : Math.round(p * 100) + ' %';
const ALT = {rows:[], abs:[], kap:[], by:new Map()};
(function(){
  const ai = new Map();
  D.mapping.alt.forEach((a, i) => {

function renderFmax(){

}
(function(){
  const cnt = new Map(); R.forEach(r => cnt.set(r.n, (cnt.get(r.n)||0)+1));

})();
function matchQ(r, toks){
  if (st.view === 'mp') { for (const t of toks) { if (/^\d/.test(t)) { if (!String(r.zs).startsWith(t) && !r.pz.has(t)) return false; } else if (!r.lt.includes(t)) return false; } return true; }
  for (const t of toks) {
    if (/^\d+$/.test(t)) { if (!r.zs.startsWith(t)) return false; }
    else if (!r.lt.includes(t)) return false;
  }

}
function apply(keepActive){
  const toks = st.q.toLowerCase().split(/\s+/).filter(Boolean);
  const nav = r => (st.abs===null || r.a===st.abs) && (st.kap===null || U().abs[r.a].kap===st.kap) && matchQ(r, toks);
  if (st.view === 'nb') { applyNb(nav, keepActive); return; }
  if (st.view === 'iv') { applyIv(nav, keepActive); return; }
  if (st.view === 'mp') { applyMp(nav, keepActive); return; }
  const base = R.filter(r => nav(r) && (!st.fmax || maxF(r)===st.fmax) && (st.anz==='' || r.n===+st.anz));
  const cnt = Object.fromEntries(KEYS.map(k => [k,0]));
  let nOhne = 0;
  base.forEach(r => { if (!r.m) { nOhne++; return; } for (const k in r.m.gruende) cnt[k]++; });
  $('#chips').innerHTML = D.gruende.map(g =>
    `<button class="chip c${g.k}" data-k="${g.k}" aria-pressed="${st.gr.has(g.k)}" data-tip="${g.k}"><span class="ltr">${g.k}</span><span class="nm">${esc(g.name.replace(/ BMI.*| ≥.*| unter.*/,''))}</span> ×${g.faktor}<span class="cnt">${cnt[g.k].toLocaleString('de-DE')}</span></button>`).join('') +
    `<button class="chip cN" data-k="ohne" aria-pressed="${st.ohne}" title="Ziffer steht nicht in der Steigerungsmatrix: keiner der 5 AB-Gründe greift"><span class="ltr">–</span><span class="nm">Nicht durch AB steigerfähig</span><span class="cnt">${nOhne.toLocaleString('de-DE')}</span></button>`;
  result = base.filter(r => { if (st.ohne) return !r.m; for (const k of st.gr) if (!r.m || !(k in r.m.gruende)) return false; return true; });

  build(keepActive);
}
function applyNb(nav, keepActive){
  const base = R.filter(r => nav(r) && (st.nbanz==='' || ((nbHas(r,'N') || nbHas(r,'U')) && nbBucket(nbCount(r))===st.nbanz)) && (st.nbart==='' || ART[st.nbart](r)));
  const c = {N:0, U:0, o:0};
  base.forEach(r => { const n = nbHas(r,'N'), u = nbHas(r,'U'); if (n) c.N++; if (u) c.U++; if (!n && !u) c.o++; });
  $('#chipsnb').innerHTML = ['N','U'].map(t =>
    `<button class="chip ${NBT[t].cls}" data-k="${t}" aria-pressed="${st.nb.has(t)}" title="${NBT[t].tip}"><span class="ltr">${t==='N' ? '≠' : '+'}</span>${NBT[t].name}<span class="cnt">${c[t].toLocaleString('de-DE')}</span></button>`).join('') +
    `<button class="chip cN" data-k="ohne" aria-pressed="${st.nbohne}" title="Die Abrechnungsbestimmung der Ziffer enthält keine Nicht-neben- oder Nur-neben-Regel"><span class="ltr">–</span>Keine Neben-Regel<span class="cnt">${c.o.toLocaleString('de-DE')}</span></button>`;
  result = base.filter(r => { if (st.nbohne) return !nbHas(r,'N') && !nbHas(r,'U'); for (const t of st.nb) if (!nbHas(r,t)) return false; return true; });
  build(keepActive);
}
function build(keepActive){
  if (st.view !== 'ab' ? (st.sort==='f' || st.sort==='m') : st.sort==='p') { st.sort = 'z'; st.dir = 1; }
  const key = {z:r=>r.zn, t:r=>r.lt, g:r=>r.g, f:r=>fsort(maxF(r)), m:r=>maxC(r), p:r=>st.view === 'mp' ? (r.p === null ? -1 : r.p) : st.view === 'iv' ? ivIds(r).length : nbCount(r)}[st.sort];
  const groups = new Map();
  result.forEach(r => { if (!groups.has(r.a)) groups.set(r.a, []); groups.get(r.a).push(r); });
  items = []; tops = []; total = 0;
  for (const [a, rs] of groups) {
    rs.sort((x,y) => { const kx = key(x), ky = key(y); return (kx<ky?-1:kx>ky?1:x.i-y.i) * st.dir; });
    items.push({h:a, n:rs.length}); tops.push(total); total += HEADH;
    if (!st.collapsed.has(a)) for (const r of rs) { items.push(r); tops.push(total); total += ROWH; }
  }
  $('#spacer').style.height = total + 'px';
  if (!keepActive) st.active = -1;
  const sum = result.length;
  $('#status').textContent = `${sum.toLocaleString('de-DE')} von ${U().rows.length.toLocaleString('de-DE')} ${U() === ALT ? 'alten Ziffern' : 'Ziffern'}`;
  heads(); render();
}

    m: c ? (st.theo ? 'Theor. Satz' : 'Max. Satz') : (st.theo ? 'Max. Satz (theor.)' : 'Max. Gebührensatz')};

/* ---------- virtuelle Liste ---------- */

function firstAt(y){ let lo=0, hi=tops.length-1; while (lo<hi) { const mid=(lo+hi+1)>>1; if (tops[mid]<=y) lo=mid; else hi=mid-1; } return lo; }

  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - w - 8), y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tipEl = null; tip.hidden = true; }
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('scroll', hideTip, true);
document.addEventListener('keydown', e => { if (e.key==='Escape') hideTip(); }, true);

function fromHash(){
  const t = location.hash.slice(1).split('/');
  if (t[0] === 'mapping') { setView('mp', true); const d = t[1] === 'neu' ? 'neu' : 'alt'; if (d !== st.mpdir) setDir(d); if (t[2]) goto(d === 'neu' ? +t[2] : decodeURIComponent(t[2])); return; }
  const m = /^#(neben|intervalle)?\/?(\d+)?$/.exec(location.hash); if (!m) return;
  setView(m[1] === 'neben' ? 'nb' : m[1] === 'intervalle' ? 'iv' : 'ab', true);
  if (m[2]) goto(+m[2]);
}
window.addEventListener('hashchange', fromHash);

renderHinweis(); renderNav(); renderFmax(); renderNbSel(); renderIvSel(); renderMpSel(); apply(); fromHash();
</script>
